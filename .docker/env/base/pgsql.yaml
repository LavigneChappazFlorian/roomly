services:
  pgsql:
    image: "postgres:16"
    restart: "always"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "roomly"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-roomly}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - proxy

volumes:
  pgsql_data:
